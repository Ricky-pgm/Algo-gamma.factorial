          a: "For a non-negative integer n, n! = 1 × 2 × … × n as usual. This tool evaluates n! = Γ(n+1), where Γ is Euler's Gamma function, so the same notation keeps an exact, smooth meaning for any real or complex input — for example (-0.5)! = √π ≈ 1.7725."

          q: "Which numbers can I type in?",
          a: "Integers and decimal numbers with a dot (2, -3.75), scientific notation (2e3), and complex numbers written with i or j — e.g. 1+2i, -0.5j or just i. Spaces inside complex literals are ignored."

          q: "Which operations are supported?",
          a: "The suffix operators n! and n!! (double factorial), and the functions gamma(z), factorial(n), doublefactorial(n), C(n, k) / binomial(n, k) and beta(a, b). A bare number is simply echoed back."

        {
          q: "Why is (-0.5)! = √π and not an error?",
          a: "Because Γ(1/2) = √π. The Gamma function interpolates the factorial smoothly between integers, and for negative non-integer inputs it stays finite thanks to Euler's reflection formula Γ(z)·Γ(1−z) = π / sin(πz)."
        },
        {
          q: "Why do (-1)!, (-2)! … return an error?",
          a: "Γ(z) has poles at z = 0, −1, −2, …, so n! diverges whenever n+1 is a non-positive integer: the value genuinely blows up to infinity, and there is no finite answer to display."
        },
        {
          q: "How accurate are the results?",
          a: "Computations use IEEE-754 double precision through the Lanczos approximation (g = 7) — about 15 significant digits, matching the Python package this site mirrors. Factorials overflow beyond n ≈ 170, because doubles cap near 1.8 × 10^308."

          a: "Für eine nichtnegative ganze Zahl n ist n! = 1 × 2 × … × n wie gewohnt. Dieses Werkzeug berechnet n! = Γ(n+1), wobei Γ die eulersche Gammafunktion ist — dieselbe Notation behält also für jede reelle oder komplexe Eingabe eine exakte, stetige Bedeutung, z. B. (-0.5)! = √π ≈ 1.7725."

  function currentLang() {
    // setLang() syncs documentElement.lang before running the hook.
    return document.documentElement.lang || "en";
  }

  function applyCopy() {
    const s = COPY[currentLang()] || COPY.en;
    document.getElementById("eyebrow").textContent = GF.t("eyebrow");
    document.getElementById("pageTitle").textContent = s.title;
    document.getElementById("pageLede").textContent = s.lede;
    document.title = s.title + " — gamma-factorial";

    const list = document.getElementById("faqList");
    list.innerHTML = "";
    for (const item of s.items) {
      const details = document.createElement("details");
      details.className = "faq-item";
      const summary = document.createElement("summary");
      summary.textContent = item.q;
      const body = document.createElement("div");
      body.className = "faq-answer";
      const p = document.createElement("p");
      p.textContent = item.a;
      body.appendChild(p);
      details.appendChild(summary);
      details.appendChild(body);
      list.appendChild(details);
    }
  }

  GF.setLangHook(applyCopy);
  GF.initLangUI();
  GF.setLang(GF.detectInitialLang());
  GF.initThemeToggle();
})();
</script>
