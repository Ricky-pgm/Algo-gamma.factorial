<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How it's computed — gamma-factorial</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.85em%27 font-size=%2790%27 fill=%27%234f46e5%27%3EΓ%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="description" content="The full step-by-step derivation behind every generalized factorial, Gamma, double factorial, binomial and beta result.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
<header class="site-header">
  <div class="header-inner">
    <div class="header-top">
      <p class="eyebrow" id="eyebrow">gamma-factorial</p>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label=""></button>
        <div class="lang-switch">
          <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="lang-globe" aria-hidden="true">🌐</span>
            <span id="langBtnLabel">EN</span>
          </button>
          <div class="lang-menu" id="langMenu" role="menu" hidden>
            <button class="lang-option" type="button" role="menuitem" data-lang="en">English</button>
            <button class="lang-option" type="button" role="menuitem" data-lang="fr">Français</button>
            <button class="lang-option" type="button" role="menuitem" data-lang="de">Deutsch</button>
          </div>
        </div>
      </div>
    </div>
    <nav class="sub-nav" id="subNav" aria-label="Sections"></nav>
  </div>
</header>

  <h1 id="pageTitle">How it's computed</h1>
  <p class="lede" id="pageLede"></p>

  <div class="calc">
    <div class="input-row">
      <span class="prefix">ƒ</span>
      <input id="exprInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="evaluate-btn" id="evalBtn" type="button">Evaluate</button>
    </div>

    <div class="keypad" id="keypad"></div>

    <div class="result-area" id="resultArea">
      <p class="result-empty" id="resultEmpty"></p>
    </div>
  </div>

  <div class="examples" id="examples">
    <div class="example-group-chips">
      <button class="example-chip" type="button" data-expr="5!">5!</button>
      <button class="example-chip" type="button" data-expr="-0.5!">-0.5!</button>
      <button class="example-chip" type="button" data-expr="gamma(0.2)">gamma(0.2)</button>
      <button class="example-chip" type="button" data-expr="7!!">7!!</button>
      <button class="example-chip" type="button" data-expr="C(10, 3)">C(10, 3)</button>
      <button class="example-chip" type="button" data-expr="C(10, 2.5)">C(10, 2.5)</button>
      <button class="example-chip" type="button" data-expr="beta(2, 3)">beta(2, 3)</button>
    </div>
  </div>

  <footer class="page-foot">
    <p class="note" id="noteText"></p>
  </footer>
</div>

<script src="js/i18n.js"></script>
<script src="js/math.js"></script>
<script src="js/api.js"></script>
<script src="js/plot.js"></script>
<script src="js/domain-viz.js"></script>
<script src="js/reasoning.js"></script>
<script src="js/practical.js"></script>
<script src="js/keypad.js"></script>
<script src="js/theme.js"></script>
<script src="js/favorites.js"></script>
<script src="js/nav.js"></script>
<script>
(function () {
  "use strict";

  GF.initDetailPage({
    navKey: "reasoning",
    buildContentBlock: (plot, value) => GF.makeReasoningBlock(plot, value),
    titleKey: "reasoningPageTitle",
    ledeKey: "reasoningPageLede",
    emptyKey: "reasoningEmpty",
    onComplexResult: (resultArea) => {
      const cap = document.createElement("p");
      cap.className = "plot-caption";
      cap.textContent = GF.t("complexNote");
      resultArea.appendChild(cap);
    },
  });
})();
</script>
</body>
</html>
