[project]
name = "gamma-factorial"
version = "0.1.0"
description = "Generalized factorial via the Gamma function (Lanczos), valid for any real/complex number"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
gamma-factorial = "gamma_factorial.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gamma_factorial*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["gamma_factorial"]
